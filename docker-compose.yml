services:
  db:
    image: postgres:17.5-alpine
    restart: always
    environment:
      POSTGRES_DB: ETL_Products 
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./tables/promocao.sql:/docker-entrypoint-initdb.d/promocao.sql

  app:
    build: .
    command: sh -c "sleep 10 && python main.py"
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - .:/app  
    environment:
      - TZ=America/Sao_Paulo

  scheduler:
    build: .
    command: sh -c "sleep 15 && python scheduler.py"
    restart: unless-stopped
    volumes:
      - .:/app  
    environment:
      - TZ=America/Sao_Paulo  
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - db  

volumes:
  db_data: